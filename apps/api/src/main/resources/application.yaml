server:
  port: 3000
  forward-headers-strategy: none
spring:
  config:
    import: configtree:/run/capmoney-secrets/
  application:
    name: capmoney-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME}?connectTimeout=1&socketTimeout=2&cancelSignalTimeout=1&tcpKeepAlive=true
    username: ${DB_USER}
    password: ${pg_password}
    hikari:
      connection-timeout: 1000
      validation-timeout: 1000
      initialization-fail-timeout: -1
      maximum-pool-size: 3
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 1s
      connect-timeout: 1s
      database: ${REDIS_DATABASE:0}
  jdbc:
    template:
      query-timeout: 1s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 1000
      mail.smtp.timeout: 1000
      mail.smtp.writetimeout: 1000
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
capmoney:
  security:
    cookie-secure: ${COOKIE_SECURE:true}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    email: ${MANAGER_EMAIL:}
  origin: ${APP_ORIGIN}
  api-subnet: ${API_SUBNET}
  edge-secret-file: ${EDGE_SECRET_FILE}
  jwt-key-file: ${JWT_KEY_FILE:/run/capmoney-secrets/jwt_signing}
  jwt-lookup-key-file: ${JWT_LOOKUP_KEY_FILE:/run/capmoney-secrets/jwt_lookup}
  jwt-keyring-dir: ${JWT_KEYRING_DIR:}
  jwt-active-kid: ${JWT_ACTIVE_KID:v1}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.orm.jdbc.bind: OFF
